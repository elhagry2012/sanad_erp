[theme]
primaryColor = "#0F9D75"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F1E6"
textColor = "#0A1F44"
font = "sans serif"

[server]
headless = true
enableXsrfProtection = true   # حماية CSRF لرفع الملفات
enableCORS = true
maxUploadSize = 10            # ميجابايت

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
