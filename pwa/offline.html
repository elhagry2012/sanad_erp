<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A1F44">
  <title>سند للأعمال — لا يوجد اتصال</title>
  <style>
    :root { --navy: #0A1F44; --gold: #C8A24A; --green: #0F9D75; --bg: #FFFFFF; --muted: #5B6B8C; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0A1F44; --navy: #FFFFFF; --muted: #C9D2E3; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
           font-family: "Cairo", "Tahoma", system-ui, sans-serif; background: var(--bg); color: var(--navy); }
    main { max-width: 420px; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 22px; }
    h1 { font-size: 1.4rem; margin: 18px 0 8px; }
    p { color: var(--muted); line-height: 1.7; margin: 0 0 22px; }
    button { min-height: 48px; padding: 0 28px; border: 0; border-radius: 10px; background: var(--green); color: #fff;
             font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <img src="__ICON__" alt="شعار سند للأعمال">
    <h1>لا يوجد اتصال بالخادم</h1>
    <p>سند للأعمال يعمل مباشرة على الخادم حتى تبقى الأرقام والأرصدة محدّثة دائمًا. تحقق من اتصال الإنترنت أو الشبكة المحلية ثم أعد المحاولة.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </main>
</body>
</html>
